<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise segmentation foundation progress</title>
  <desc id="desc">Sanitized architecture showing user network connected through an enterprise firewall to isolated IoT, printer, and storage zones, with management zone marked as the next milestone.</desc>
  <defs>
    <style>
      .box{fill:#fff;stroke:#25364a;stroke-width:3;rx:18;ry:18}
      .done{fill:#eef7f1;stroke:#2e6b49;stroke-width:3;rx:18;ry:18}
      .next{fill:#f7f3ea;stroke:#8a6d2f;stroke-width:3;stroke-dasharray:10 8;rx:18;ry:18}
      .title{font:700 30px Arial,sans-serif;fill:#172536}
      .label{font:700 22px Arial,sans-serif;fill:#172536}
      .small{font:400 17px Arial,sans-serif;fill:#425466}
      .status{font:700 16px Arial,sans-serif;fill:#2e6b49}
      .statusnext{font:700 16px Arial,sans-serif;fill:#8a6d2f}
      .line{stroke:#4d6377;stroke-width:4;fill:none}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" class="title">Network Segmentation Foundation — Current Progress</text>

  <rect x="465" y="95" width="270" height="110" class="box"/>
  <text x="600" y="138" text-anchor="middle" class="label">Enterprise Firewall</text>
  <text x="600" y="169" text-anchor="middle" class="small">routing • policy • logging</text>

  <rect x="70" y="285" width="240" height="120" class="box"/>
  <text x="190" y="330" text-anchor="middle" class="label">User Network</text>
  <text x="190" y="365" text-anchor="middle" class="small">authorized endpoints</text>

  <rect x="350" y="285" width="240" height="120" class="done"/>
  <text x="470" y="325" text-anchor="middle" class="label">IoT Zone</text>
  <text x="470" y="357" text-anchor="middle" class="status">PASS</text>
  <text x="470" y="382" text-anchor="middle" class="small">restricted services</text>

  <rect x="630" y="285" width="240" height="120" class="done"/>
  <text x="750" y="325" text-anchor="middle" class="label">Printer Zone</text>
  <text x="750" y="357" text-anchor="middle" class="status">PASS</text>
  <text x="750" y="382" text-anchor="middle" class="small">print protocols only</text>

  <rect x="910" y="285" width="240" height="120" class="done"/>
  <text x="1030" y="325" text-anchor="middle" class="label">Storage Zone</text>
  <text x="1030" y="357" text-anchor="middle" class="status">PASS</text>
  <text x="1030" y="382" text-anchor="middle" class="small">approved SMB clients</text>

  <rect x="465" y="500" width="270" height="120" class="next"/>
  <text x="600" y="542" text-anchor="middle" class="label">Management Zone</text>
  <text x="600" y="574" text-anchor="middle" class="statusnext">NEXT</text>
  <text x="600" y="600" text-anchor="middle" class="small">privileged admin plane</text>

  <path d="M600 205 L600 245 L190 245 L190 285" class="line"/>
  <path d="M600 245 L470 245 L470 285" class="line"/>
  <path d="M600 245 L750 245 L750 285" class="line"/>
  <path d="M600 245 L1030 245 L1030 285" class="line"/>
  <path d="M600 205 L600 500" class="line"/>

  <text x="600" y="665" text-anchor="middle" class="small">Sanitized public diagram — internal addressing, hostnames, credentials, and device identifiers intentionally omitted.</text>
</svg>
