<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 520" role="img" aria-labelledby="title desc">
<title id="title">Sanitized IoT segmentation validation path</title>
<desc id="desc">A field sensor sends telemetry through a LoRaWAN edge and isolated IoT segment, across an explicit MQTT firewall policy to a broker and application bridge.</desc>
<defs><style>
.bg{fill:#f6f8fb}
.card{fill:#fff;stroke:#d9e2ec;stroke-width:2}
.edge{fill:#102a43}
.line{stroke:#486581;stroke-width:4;fill:none}
.t1{font:700 30px Arial,sans-serif;fill:#102a43}
.t2{font:700 18px Arial,sans-serif;fill:#102a43}
.t3{font:15px Arial,sans-serif;fill:#486581}
.ok{font:700 15px Arial,sans-serif;fill:#0b6b35}
.white{font:700 19px Arial,sans-serif;fill:#fff}
.edgeSub{font:15px Arial,sans-serif;fill:#d9e2ec}
.edgeOk{font:700 15px Arial,sans-serif;fill:#8ee6ad}
</style></defs>

<rect width="1520" height="520" class="bg"/>
<text x="70" y="58" class="t1">CHG-009 — Sanitized End-to-End IoT Validation</text>
<text x="70" y="88" class="t3">Real endpoint - isolated network segment - least-privilege service path - application continuity</text>

<g transform="translate(55,150)">
  <rect width="190" height="150" rx="16" class="card"/>
  <text x="95" y="48" text-anchor="middle" class="t2">Field Sensor</text>
  <text x="95" y="78" text-anchor="middle" class="t3">Field telemetry</text>
  <text x="95" y="116" text-anchor="middle" class="ok">PASS</text>
</g>

<path d="M245 225 H315" class="line"/>

<g transform="translate(315,150)">
  <rect width="190" height="150" rx="16" class="card"/>
  <text x="95" y="44" text-anchor="middle" class="t2">LoRaWAN Edge</text>
  <text x="95" y="72" text-anchor="middle" class="t3">Join + uplink</text>
  <text x="95" y="98" text-anchor="middle" class="t3">Network server</text>
  <text x="95" y="126" text-anchor="middle" class="ok">PASS</text>
</g>

<path d="M505 225 H575" class="line"/>

<g transform="translate(575,150)">
  <rect width="190" height="150" rx="16" class="edge"/>
  <text x="95" y="44" text-anchor="middle" class="white">IoT Segment</text>
  <text x="95" y="74" text-anchor="middle" class="edgeSub">Dedicated VLAN</text>
  <text x="95" y="100" text-anchor="middle" class="edgeSub">Default deny</text>
  <text x="95" y="128" text-anchor="middle" class="edgeOk">PASS</text>
</g>

<path d="M765 225 H915" class="line"/>
<text x="840" y="205" text-anchor="middle" class="t3">Explicit MQTT policy</text>

<g transform="translate(915,150)">
  <rect width="190" height="150" rx="16" class="card"/>
  <text x="95" y="44" text-anchor="middle" class="t2">MQTT Broker</text>
  <text x="95" y="74" text-anchor="middle" class="t3">TCP service only</text>
  <text x="95" y="100" text-anchor="middle" class="t3">Raw pub/sub verified</text>
  <text x="95" y="128" text-anchor="middle" class="ok">PASS</text>
</g>

<path d="M1105 225 H1190" class="line"/>

<g transform="translate(1190,150)">
  <rect width="250" height="150" rx="16" class="card"/>
  <text x="125" y="44" text-anchor="middle" class="t2">Application Bridge</text>
  <text x="125" y="74" text-anchor="middle" class="t3">Live telemetry ingest</text>
  <text x="125" y="100" text-anchor="middle" class="t3">Decode + update</text>
  <text x="125" y="128" text-anchor="middle" class="ok">PASS</text>
</g>

<rect x="70" y="360" width="1370" height="90" rx="14" class="card"/>
<text x="100" y="395" class="t2">Validation outcome</text>
<text x="100" y="425" class="t3">Service continuity preserved after segmentation; required management and application paths were added explicitly rather than reopening broad inter-VLAN access.</text>
</svg>