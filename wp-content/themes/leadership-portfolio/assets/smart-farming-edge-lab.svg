<title id="title">Smart Farming and Edge Computing - public safe lab flow</title><desc id="desc">A validated camera sends images to a Raspberry Pi, which stores them on a USB SSD and securely backs them up to a NAS. Planned sensors and messaging are shown as future stages.</desc>
